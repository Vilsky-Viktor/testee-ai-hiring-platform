name: Browser tests

# The signed-out and signed-in suites on the whole stack, with a budget of their own: called from
# ci.yml when the stack changed.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  browser:
    name: browser tests (whole stack)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # As in the smoke job.
      - run: |
          cp .env.example .env
          sed -i 's/^SUPERADMIN_EMAILS=.*/SUPERADMIN_EMAILS=ci-superadmin@example.com/' .env
      - run: docker compose up --build -d
      - run: ./scripts/wait-for-stack.sh
      # The signed-out pages in a real browser (Playwright's image), on desktop and phone sizes.
      - name: Page tests
        run: ./e2e_tests/pages.sh
      # The signed-in pages through the Auth emulator. Interviews are made from templates, and the
      # database has none: a small English one is added first (no OpenAI).
      - name: Signed-in tests
        run: |
          docker compose exec -T library uv run --no-sync python - < e2e_tests/signed-in/seed/template.py
          ./e2e_tests/signed-in.sh
      - name: Test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-results
          path: |
            e2e_tests/pages/test-results
            e2e_tests/signed-in/test-results
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 100
      - if: always()
        run: docker compose down -v
